# ==============================================================================
# TẬP TIN CẤU HÌNH THÔNG SỐ KẾT NỐI MICROSOFT SQL SERVER JDBC
# Hệ Thống Quản Lý Cửa Hàng Thú Cưng Mio - Nhóm 07 (IUH)
# ==============================================================================
# Hướng dẫn điều chỉnh:
# - db.host: Địa chỉ máy chủ (để localhost nếu chạy trên máy tính cá nhân)
# - db.port: Cổng TCP/IP tiêu chuẩn của SQL Server (mặc định 1433)
# - db.name: Tên cơ sở dữ liệu (HeThongQuanLyCuaHangThuCung / QuanLyCuaHangThuCung)
# - db.user: Tên tài khoản quản trị SQL Server Authentication (mặc định: sa)
# - db.password: Mật khẩu của tài khoản sa (ví dụ: sapassword)
# - db.instance: Tên Named Instance (SQLEXPRESS dành cho bản Express Edition)
# - db.timeout: Thời gian giới hạn thử kết nối (tính bằng giây, mặc định 3 giây)
# ==============================================================================

db.host=localhost
db.port=1433
db.name=QuanLyCuaHangThuCung
db.user=sa
db.password=sapassword
db.instance=SQLEXPRESS
db.timeout=3
